# Runs the same gate as AGENTS.md on every push: install from the lockfile,
# then test + typecheck + lint + build via `npm run check`.
name: check

on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
